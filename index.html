<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gordino's</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Gordino's · Restaurante e Marmitaria">
<meta property="og:description" content="Americana/SP · Unidades, horários e pedidos online.">
<meta property="og:image" content="https://richardpessuti.github.io/Site-Gordino-s/og-image.png">
<meta property="og:url" content="https://richardpessuti.github.io/Site-Gordino-s/">
<meta name="theme-color" content="#700E0B">
<link rel="icon" href="logo.webp">
<meta name="description" content="Gordino's — restaurante e marmitaria em Americana/SP: unidades, horários e pedidos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=202610042025">
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-logo"><img src="logo.webp" alt="Gordino's" width="463" height="480"></div>
    <h1 class="hero-name">Gordino<span>'s</span></h1>
    <p class="hero-tag" id="tagline"></p>
    <div class="statusline" id="statuses"></div>
    <div class="quick">
      <a class="qbtn main" id="qPedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Fazer pedido</a>
      <button class="qbtn sm" id="qGo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Como chegar</button>
      <button class="qbtn sm" id="qFale" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>Fale conosco</button>
      <a class="qbtn sm" id="qSite" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>Site do Gordino's</a>
    </div>
  </header>

  <main class="content">
    <section id="unidades"></section>
  </main>

  <a class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Fazer pedido</a>

  <div class="sheet-bg" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet">
      <h3 id="sheetTitle"></h3>
      <p id="sheetText"></p>
      <div id="sheetOpts"></div>
      <button class="cancel" type="button" id="sheetClose">Cancelar</button>
    </div>
  </div>

  <footer class="footer">
    <div class="igs" id="igs"></div>
    <p class="copy">© <span id="year"></span> Gordino's</p>
  </footer>
</div>

<script src="dados.js?v=202610042025"></script>
<script>
$("tagline").textContent = SITE.tagline;
$("year").textContent = now.getFullYear();

var statusHtml = "", unitsHtml = "";
SITE.unidades.forEach(function(u, i){
  var st = status(u.horarios), dot = '<span class="dot' + (st.open ? '' : ' closed') + '"></span>';
  var q = encodeURIComponent(u.endereco + ", " + u.bairro.replace(/·/g, ","));
  var curto = st.open ? st.text.replace("Aberta agora · até", "Aberta até") : st.text.replace("Fechada · ", "");
  statusHtml += '<span>' + dot + esc(u.aba + " · " + u.titulo) + '<em>' + esc(curto) + '</em></span>';

  var rows = "";
  for (var d = 0; d < 7; d++){
    var h = u.horarios[d];
    rows += '<div class="hrow' + (d === today ? ' today' : '') + '"><span>' + DIAS[d] + (d === today ? ' · hoje' : '') +
      '</span><span class="h">' + (h ? hh(h[0]) + ' às ' + hh(h[1]) : 'Fechado') + '</span></div>';
  }

  u.st = st;
  unitsHtml += '<div class="card" id="' + u.id + '" hidden>' +
    '<div class="eyebrow">' + esc(u.aba) + '</div>' +
    '<h2 class="card-title">' + esc(u.titulo) + '</h2>' +
    '<div class="unit-status">' + dot + esc(st.text) + '</div>' +
    '<p class="addr"><b>' + esc(u.endereco) + '</b><br>' + esc(u.bairro) + '</p>' +
    '<div class="btnrow"><a class="btn" target="_blank" rel="noopener" href="' + u.pedido + '">Fazer pedido</a>' +
    '<a class="btn ghost" target="_blank" rel="noopener" href="https://maps.google.com/?q=' + q + '">Como chegar</a>' +
    '</div>' +
    '<div class="map"><iframe loading="lazy" title="Mapa ' + esc(u.titulo) + '" src="https://www.google.com/maps?q=' + q + '&output=embed"></iframe></div>' +
    '<div class="card-sub">Horários</div><p class="lead">' + esc(u.resumo) + '</p>' + rows +
    '<p class="obs"><b>Feriados:</b> o horário pode mudar. Consulte a unidade para saber se ela estará aberta. ' +
    '<a target="_blank" rel="noopener" href="' + waUrl(u) + '">Falar com a unidade</a></p>' +
    '</div>';
});
$("statuses").innerHTML = statusHtml;
$("unidades").innerHTML = unitsHtml;

// Janela de escolha da unidade: "wa" abre o WhatsApp da loja, "go" mostra o cartão da unidade
var WAICON = $("qFale").querySelector("svg").outerHTML, PINICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
var SHEETS = {
  wa: { titulo: "Falar com qual unidade?", texto: "Você vai direto pro WhatsApp da loja escolhida." },
  go: { titulo: "Qual unidade?", texto: "Veja endereço, horários e como chegar." }
};
function openSheet(modo){
  var opts = "";
  SITE.unidades.forEach(function(u){
    var info = '<span><b>' + esc(u.aba + " · " + u.titulo) + '</b><small><span class="dot' + (u.st.open ? '' : ' closed') + '"></span>' + esc(u.st.text) + '</small></span>';
    opts += modo === "wa"
      ? '<a class="opt" target="_blank" rel="noopener" href="' + waUrl(u) + '">' + info + '<span class="go">' + WAICON + '</span></a>'
      : '<a class="opt" href="#' + u.id + '" data-unit="' + u.id + '">' + info + '<span class="go pin">' + PINICON + '</span></a>';
  });
  $("sheetTitle").textContent = SHEETS[modo].titulo;
  $("sheetText").textContent = SHEETS[modo].texto;
  $("sheetOpts").innerHTML = opts;
  $("sheet").classList.add("open");
}
function closeSheet(){ $("sheet").classList.remove("open"); }
function showUnit(id){
  SITE.unidades.forEach(function(u){ $(u.id).hidden = u.id !== id; });
  $(id).scrollIntoView({ behavior: "smooth", block: "start" });
}
$("sheetClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", function(e){
  var opt = e.target.closest(".opt");
  if (opt && opt.dataset.unit){ e.preventDefault(); closeSheet(); showUnit(opt.dataset.unit); return; }
  if (e.target === this || opt) closeSheet();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });
$("qGo").addEventListener("click", function(){ openSheet("go"); });
$("qFale").addEventListener("click", function(){ openSheet("wa"); });
$("qSite").href = SITE.site;
["qPedido","fab"].forEach(function(id){ $(id).href = SITE.pedido; });
// Botão flutuante só aparece depois que o "Fazer pedido" do topo sai da tela
if ("IntersectionObserver" in window){
  $("fab").classList.add("hide");
  new IntersectionObserver(function(e){ $("fab").classList.toggle("hide", e[0].isIntersecting); }).observe($("qPedido"));
}
$("igs").innerHTML = SITE.instagram.map(function(u){
  return '<a class="ig" target="_blank" rel="noopener" href="https://www.instagram.com/' + u + '/">@' + esc(u) + '</a>';
}).join("");

</script>
</body>
</html>
