<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gordino's</title>
<link rel="icon" href="logo.webp">
<meta name="description" content="Gordino's — restaurante e marmitaria em Americana/SP: horários, endereços e pedidos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#2B1A12;
    --bg-2:#1E120C;
    --accent:#F2B11F;
    --accent-2:#E3242B;
    --cream:#FFF6E6;
    --cream-2:#FBEBCF;
    --ink:#2B1A12;
    --ink-soft:#6E5446;
    --line:rgba(43,26,18,0.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg-2);color:var(--cream);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .page{max-width:560px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 70%);}

  /* HERO */
  .hero{padding:52px 24px 22px;text-align:center;}
  .hero-logo{width:150px;margin:0 auto 16px;filter:drop-shadow(0 14px 30px rgba(0,0,0,0.45));}
  .hero-logo img{width:100%;height:auto;display:block;}
  .hero-name{font-weight:800;font-size:2.8rem;letter-spacing:-0.03em;line-height:1;color:#fff;}
  .hero-name span{color:var(--accent);}
  .hero-tag{margin-top:10px;font-size:0.98rem;color:rgba(255,255,255,0.7);font-weight:500;}
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:9px 18px;border-radius:100px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);font-size:0.86rem;font-weight:700;color:#fff;}
  .dot{width:9px;height:9px;border-radius:50%;background:#5FD07A;box-shadow:0 0 0 3px rgba(95,208,122,0.25);}
  .dot.closed{background:#E9927C;box-shadow:0 0 0 3px rgba(233,146,124,0.25);}

  /* TABS */
  .tabs-wrap{padding:12px 16px 6px;position:sticky;top:0;z-index:40;background:rgba(30,18,12,0.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.07);padding:5px;border-radius:100px;}
  .tab{flex:1;border:none;background:transparent;color:rgba(255,255,255,0.8);font-family:inherit;font-weight:700;font-size:0.9rem;
    padding:11px 6px;border-radius:100px;cursor:pointer;transition:all .2s;}
  .tab.active{background:var(--accent);color:var(--bg-1);}

  .content{padding:16px 16px 8px;}
  .pane{display:none;animation:fade .25s ease;}
  .pane.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* CARDS */
  .card{background:var(--cream);color:var(--ink);border-radius:24px;padding:24px 22px;margin-bottom:14px;scroll-margin-top:80px;}
  .card-title{font-weight:800;font-size:1.6rem;letter-spacing:-0.02em;margin:6px 0 4px;}
  .eyebrow{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;font-weight:800;color:var(--accent-2);}
  .lead{font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);margin-bottom:14px;}
  .hrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
  .hrow:last-child{border-bottom:none;}
  .hrow.today{font-weight:800;color:var(--accent-2);}
  .hrow .h{color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .hrow.today .h{color:inherit;}
  .addr{font-size:1.05rem;}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--accent-2);color:#fff;text-decoration:none;
    padding:14px 22px;border-radius:100px;font-weight:700;font-size:0.95rem;}
  .btn.wa{background:#1FA855;}
  .map{margin-top:16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);height:210px;}
  .map iframe{width:100%;height:100%;border:0;display:block;}
  .list{list-style:none;margin-top:6px;}
  .list li{padding:5px 0 5px 18px;position:relative;}
  .list li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent-2);}

  .footer{text-align:center;padding:28px 24px 44px;}
  .ig{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);
    border-radius:100px;color:#fff;text-decoration:none;font-weight:700;font-size:0.92rem;}
  .copy{margin-top:20px;font-size:0.72rem;color:rgba(255,255,255,0.45);letter-spacing:0.1em;text-transform:uppercase;}

  .statuses{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px;}
  .statuses .status{margin-top:0;}
  .unit-status{display:inline-flex;align-items:center;gap:8px;margin:2px 0 12px;font-weight:700;font-size:0.9rem;color:var(--ink);}
  .map + .card-sub{margin-top:22px;}
  .card-sub{font-size:0.78rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin:18px 0 4px;}

  @media (max-width:420px){.hero-name{font-size:2.4rem;}.tab{font-size:0.82rem;}}
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-logo"><img src="logo.webp" alt="Gordino's" width="463" height="480"></div>
    <h1 class="hero-name">Gordino<span>'s</span></h1>
    <p class="hero-tag" id="tagline"></p>
    <div class="statuses" id="statuses"></div>
  </header>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>

  <main class="content" id="panes">
    <section class="pane" id="pedidos">
      <div class="card">
        <div class="eyebrow">WhatsApp</div>
        <h2 class="card-title">Peça pelo WhatsApp.</h2>
        <p class="lead">Retirada no balcão ou entrega na região.</p>
        <ul class="list">
          <li>Mande o pedido e o endereço</li>
          <li>Confirmamos o valor e o tempo de preparo</li>
          <li>Pagamento: Pix, cartão ou dinheiro</li>
        </ul>
        <a class="btn wa" id="waBtn" target="_blank" rel="noopener">Pedir no WhatsApp &rarr;</a>
      </div>
      <div class="card" id="ifoodCard" hidden>
        <div class="eyebrow">Delivery</div>
        <h2 class="card-title">Também no iFood.</h2>
        <a class="btn" id="ifoodBtn" target="_blank" rel="noopener">Pedir pelo iFood &rarr;</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="ig" id="igBtn" target="_blank" rel="noopener"></a>
    <p class="copy">© <span id="year"></span> Gordino's</p>
  </footer>
</div>

<script>
/* ==========================================================
   DADOS DO GORDINO'S — edite só esta parte.
   whatsapp e instagram ainda são EXEMPLOS.
   ========================================================== */
var SITE = {
  tagline: "Restaurante e marmitaria · Americana/SP",
  whatsapp: "5511999999999",           // só números, com 55 + DDD
  instagram: "gordinos",               // sem @
  ifood: "",                           // link do iFood (deixe "" se não tiver)

  // Cada unidade vira uma aba. Horários: [abre, fecha] em horas; null = fechado.
  // Dias: 0 = Domingo, 1 = Segunda ... 6 = Sábado.
  unidades: [
    {
      id: "restaurante",
      aba: "Restaurante",
      titulo: "Restaurante",
      endereco: "Rua São Vito, 1812",
      bairro: "Santa Cruz · Americana/SP",
      resumo: "Todos os dias, das 8h às 14h.",
      horarios: { 0:[8,14], 1:[8,14], 2:[8,14], 3:[8,14], 4:[8,14], 5:[8,14], 6:[8,14] }
    },
    {
      id: "marmitaria",
      aba: "Marmitaria",
      titulo: "Marmitaria · Loja 2",
      endereco: "Av. Antônio Conselheiro, 332",
      bairro: "Antônio Zanaga II · Americana/SP",
      resumo: "De segunda a sábado, das 8h às 14h.",
      horarios: { 0:null, 1:[8,14], 2:[8,14], 3:[8,14], 4:[8,14], 5:[8,14], 6:[8,14] }
    }
  ]
};

/* ============ não precisa mexer daqui pra baixo ============ */
var DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function hh(n){ return (n % 24) + "h"; }

var now = new Date(), today = now.getDay();

// Status aberto/fechado de uma unidade (considera horário que passa da meia-noite)
function status(hor){
  var t = now.getHours() + now.getMinutes() / 60;
  var h = hor[today], y = hor[(today + 6) % 7];
  if ((h && t >= h[0] && t < h[1]) || (y && y[1] > 24 && t < y[1] - 24))
    return { open: true, text: "Aberto agora · até " + hh(h && t >= h[0] ? h[1] : y[1]) };
  for (var i = 0; i < 7; i++){
    var d = (today + i) % 7, x = hor[d];
    if (x && (i > 0 || t < x[0]))
      return { open: false, text: "Fechado · abre " + (i === 0 ? "hoje" : i === 1 ? "amanhã" : DIAS[d].toLowerCase()) + " às " + hh(x[0]) };
  }
  return { open: false, text: "Fechado" };
}

$("tagline").textContent = SITE.tagline;
$("year").textContent = now.getFullYear();

var tabsHtml = "", statusHtml = "", panesHtml = "";
SITE.unidades.forEach(function(u, i){
  var st = status(u.horarios), dot = '<span class="dot' + (st.open ? '' : ' closed') + '"></span>';
  var q = encodeURIComponent(u.endereco + ", " + u.bairro.replace(/·/g, ","));
  tabsHtml += '<button class="tab' + (i === 0 ? ' active' : '') + '" data-tab="' + u.id + '">' + esc(u.aba) + '</button>';
  statusHtml += '<div class="status">' + dot + '<span>' + esc(u.aba) + ': ' + esc(st.text) + '</span></div>';

  var rows = "";
  for (var d = 0; d < 7; d++){
    var h = u.horarios[d];
    rows += '<div class="hrow' + (d === today ? ' today' : '') + '"><span>' + DIAS[d] + (d === today ? ' · hoje' : '') +
      '</span><span class="h">' + (h ? hh(h[0]) + ' às ' + hh(h[1]) : 'Fechado') + '</span></div>';
  }

  panesHtml += '<section class="pane' + (i === 0 ? ' active' : '') + '" id="' + u.id + '"><div class="card">' +
    '<div class="eyebrow">' + esc(u.aba) + '</div>' +
    '<h2 class="card-title">' + esc(u.titulo) + '</h2>' +
    '<div class="unit-status">' + dot + esc(st.text) + '</div>' +
    '<p class="addr"><b>' + esc(u.endereco) + '</b><br>' + esc(u.bairro) + '</p>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://maps.google.com/?q=' + q + '">Abrir no Maps</a>' +
    '<div class="map"><iframe loading="lazy" title="Mapa ' + esc(u.aba) + '" src="https://www.google.com/maps?q=' + q + '&output=embed"></iframe></div>' +
    '<div class="card-sub">Horários</div><p class="lead">' + esc(u.resumo) + '</p>' + rows +
    '</div></section>';
});
tabsHtml += '<button class="tab" data-tab="pedidos">Pedidos</button>';
$("tabs").innerHTML = tabsHtml;
$("statuses").innerHTML = statusHtml;
$("panes").insertAdjacentHTML("afterbegin", panesHtml);

// WhatsApp, iFood, Instagram
$("waBtn").href = "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent("Olá! Quero fazer um pedido.");
if (SITE.ifood){ $("ifoodCard").hidden = false; $("ifoodBtn").href = SITE.ifood; }
$("igBtn").href = "https://instagram.com/" + SITE.instagram;
$("igBtn").textContent = "@" + SITE.instagram;

// Abas
var tabs = document.querySelectorAll(".tab"), panes = document.querySelectorAll(".pane");
tabs.forEach(function(t){
  t.addEventListener("click", function(){
    tabs.forEach(function(x){ x.classList.remove("active"); });
    panes.forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    $(t.dataset.tab).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});
</script>
</body>
</html>
